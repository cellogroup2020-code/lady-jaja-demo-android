name: Build Lady Jaja APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Prepare web assets
        run: |
          mkdir -p app/src/main/assets
          cat payload/mobile.b64.part* | base64 -d > /tmp/mobile.zip
          unzip -oq /tmp/mobile.zip -d app/src/main/assets
          test -f app/src/main/assets/index.html
      - name: Generate Lady Jaja app icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick fonts-dejavu-core >/dev/null
          mkdir -p app/src/main/res/drawable
          convert -size 512x512 xc:'#E74605' -fill white -gravity center -font DejaVu-Sans-Bold -pointsize 112 -interline-spacing -16 -annotate +0+0 $'Lady\nJaja' app/src/main/res/drawable/ic_launcher.png
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Lady-Jaja-Demo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Lady-Jaja-Demo-APK
          path: Lady-Jaja-Demo.apk
      - name: Publish demo release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete demo-v1 --yes --cleanup-tag || true
          gh release create demo-v1 Lady-Jaja-Demo.apk --title "Lady Jaja Demo APK" --notes "Android management demo. Data is stored locally on the installed device."
