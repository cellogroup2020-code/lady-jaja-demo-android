name: Build Lady Jaja APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Prepare and verify web assets
        run: |
          rm -rf app/src/main/assets
          mkdir -p app/src/main/assets/assets
          cat payload2/mobile.part* | base64 -d > /tmp/mobile.zip
          # The original demo archive has one damaged employee.js entry. Extract the
          # remaining verified V2 assets, then replace all JS files with clean patches.
          unzip -oq /tmp/mobile.zip -d app/src/main/assets || true
          gzip -dc patch/employee.js.gz > app/src/main/assets/assets/employee.js
          gzip -dc patch/shared.js.gz > app/src/main/assets/assets/shared.js
          gzip -dc patch/backoffice.js.gz > app/src/main/assets/assets/backoffice.js
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/employee.html
          test -f app/src/main/assets/backoffice.html
          test -f app/src/main/assets/assets/logo.png
          test -f app/src/main/assets/assets/icon-512.png
          node --check app/src/main/assets/assets/shared.js
          node --check app/src/main/assets/assets/employee.js
          node --check app/src/main/assets/assets/backoffice.js
      - name: Prepare Lady Jaja app icon
        run: |
          mkdir -p app/src/main/res/drawable
          cp app/src/main/assets/assets/icon-512.png app/src/main/res/drawable/ic_launcher.png
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Lady-Jaja-Demo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Lady-Jaja-Demo-APK
          path: Lady-Jaja-Demo.apk
      - name: Publish demo release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete demo-v1 --yes --cleanup-tag || true
          gh release create demo-v1 Lady-Jaja-Demo.apk --title "Lady Jaja Demo APK" --notes "Android management demo. Data is stored locally on the installed device."
