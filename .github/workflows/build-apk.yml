name: Build Lady Jaja APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Prepare and verify web assets
        run: |
          rm -rf app/src/main/assets
          mkdir -p app/src/main/assets/assets
          cat payload2/mobile.part* | base64 -d > /tmp/mobile.zip
          unzip -oq /tmp/mobile.zip -d app/src/main/assets || true
          cp patch/employee.js app/src/main/assets/assets/employee.js
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/employee.html
          test -f app/src/main/assets/backoffice.html
          node --check app/src/main/assets/assets/shared.js
          node --check app/src/main/assets/assets/employee.js
          node --check app/src/main/assets/assets/backoffice.js
      - name: Snapshot editable web source
        run: |
          rm -rf source
          mkdir -p source/assets
          cp app/src/main/assets/index.html source/index.html
          cp app/src/main/assets/employee.html source/employee.html
          cp app/src/main/assets/backoffice.html source/backoffice.html
          cp app/src/main/assets/assets/styles.css source/assets/styles.css
          cp app/src/main/assets/assets/shared.js source/assets/shared.js
          cp app/src/main/assets/assets/backoffice.js source/assets/backoffice.js
          cp app/src/main/assets/assets/employee.js source/assets/employee.js
          cp app/src/main/assets/manifest.webmanifest source/manifest.webmanifest 2>/dev/null || true
          cp app/src/main/assets/sw.js source/sw.js 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source
          if ! git diff --cached --quiet; then
            git commit -m "Snapshot editable Lady Jaja web source [skip ci]"
            git push
          fi
      - name: Generate Lady Jaja logo and app icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick fonts-dejavu-core >/dev/null
          mkdir -p app/src/main/res/drawable app/src/main/assets/assets
          convert -size 640x260 xc:none -fill '#E74605' -gravity center -font DejaVu-Sans-Bold -pointsize 108 -interline-spacing -22 -annotate +0+0 $'Lady\nJaja' app/src/main/assets/assets/logo.png
          convert -size 512x512 xc:'#E74605' -fill white -gravity center -font DejaVu-Sans-Bold -pointsize 116 -interline-spacing -20 -annotate +0+0 $'Lady\nJaja' app/src/main/assets/assets/icon-512.png
          convert app/src/main/assets/assets/icon-512.png -resize 192x192 app/src/main/assets/assets/icon-192.png
          cp app/src/main/assets/assets/icon-512.png app/src/main/res/drawable/ic_launcher.png
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Lady-Jaja-Demo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Lady-Jaja-Demo-APK
          path: Lady-Jaja-Demo.apk
      - name: Publish demo release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete demo-v1 --yes --cleanup-tag || true
          gh release create demo-v1 Lady-Jaja-Demo.apk --title "Lady Jaja Demo APK" --notes "Android management demo. Data is stored locally on the installed device."
